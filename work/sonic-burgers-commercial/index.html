<style>
/* Layout: gallery-white portfolio in the Brian Beckwith mold. Small logo left, two-word nav right, reel first, then an edge-to-edge grid of project tiles; each tile opens a project page with prev/next. */
:root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #7a7a76;
  --line: #e6e6e3;
  --frame: #1b1c1e;      /* empty video frame */
  --frame-fg: #f2f1ee;
  --sans: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1680px; margin: 0 auto; }
@media (min-width: 900px) { .wrap { padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); } }

.note { font-family: var(--mono); font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--line); }
.note .wrap { padding-block: 8px; }

header .wrap { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-block: 28px; flex-wrap: wrap; }
.logo { font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
nav { display: flex; gap: 28px; font-size: 13px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; }
nav a { padding-bottom: 2px; border-bottom: 1px solid transparent; }
nav a:hover, nav a[aria-current="page"] { border-color: var(--fg); }

.frame { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--frame); color: var(--frame-fg); overflow: hidden; display: block; }
.frame .shade { position: absolute; inset: 0; }
.frame .play { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 72px; height: 72px; border-radius: 50%; border: 1.5px solid var(--frame-fg); display: grid; place-items: center; }
.frame .play svg { width: 22px; height: 22px; margin-left: 4px; fill: var(--frame-fg); }
.frame .cap { position: absolute; left: 18px; bottom: 16px; right: 18px; display: flex; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }

.reel { padding-block: 0 48px; }
.reel .frame .title { position: absolute; left: 24px; top: 20px; font-weight: 700; font-size: clamp(20px, 3vw, 34px); letter-spacing: .02em; text-transform: uppercase; }
.reel-line { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 14px; font-size: 13px; color: var(--muted); }
.reel-line strong { color: var(--fg); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }

.section-label { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; padding-block: 0 16px; display: flex; justify-content: space-between; gap: 12px; }
.section-label span { color: var(--muted); font-weight: 400; letter-spacing: .04em; text-transform: none; font-family: var(--mono); font-size: 11px; }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding-bottom: 72px; }
.tile { position: relative; display: block; min-width: 0; }
.tile .frame { transition: opacity .3s; }
.tile .name { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; font-weight: 600; font-size: clamp(14px, 1.4vw, 19px); letter-spacing: .02em; color: var(--frame-fg); text-wrap: balance; transition: opacity .3s; }
.tile .count { position: absolute; right: 10px; top: 10px; font-family: var(--mono); font-size: 10px; color: var(--frame-fg); opacity: .7; }
.tile:hover .frame, .tile:focus-visible .frame { opacity: .82; }
.frame .thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s, transform .6s ease; }
.frame .thumb.ok { opacity: 1; }

.project .frame .thumb.ok ~ .play { background: rgba(0,0,0,.35); }

@media (max-width: 560px) { .strapped { grid-template-columns: minmax(0, 1fr); } }

footer .ig:hover svg { opacity: .55; }
.featured { margin: 8px 0 56px; }
.featured .logos { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 28px 40px; padding: 28px 0 32px; border-bottom: 1px solid var(--line); }

@media (max-width: 760px) { .featured .logos { justify-content: flex-start; gap: 22px 28px; } .featured .lg { font-size: 18px; } }
/* Hover preview: a muted YouTube clip fades in over the thumbnail */
.tile .prev { position: absolute; inset: 0; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity .5s; z-index: 1; }
.tile .prev iframe { position: absolute; left: 50%; top: 50%; width: 140%; height: 140%; transform: translate(-50%, -50%); border: 0; }
.tile .prev.on { opacity: 1; }
.tile .name { z-index: 2; }
.tile.previewing .name { place-items: end start; background: linear-gradient(0deg, rgba(0,0,0,.6), transparent 45%); text-align: left; font-size: 13px; }
.contact dl { margin-top: 28px; }
.book { display: grid; gap: 14px; align-content: start; }
.book h5 { margin: 0 0 4px; font-size: 11px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; font-weight: 500; padding-bottom: 10px; border-bottom: 1px solid var(--fg); }
.book label { display: grid; gap: 6px; font-size: 11px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.book input, .book select, .book textarea { font: inherit; font-size: 16px; letter-spacing: 0; text-transform: none; color: var(--fg); background: #fff; border: 0; border-bottom: 1px solid #cfcfcb; border-radius: 0; padding: 8px 0; width: 100%; }
.book textarea { border: 1px solid #cfcfcb; padding: 10px; resize: vertical; }

.book button { justify-self: start; margin-top: 6px; font: inherit; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #fff; background: var(--fg); border: 1px solid var(--fg); padding: 14px 22px; cursor: pointer; }

.crew { max-width: 1200px; margin: 32px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 32px; padding-top: 12px; border-top: 1px solid var(--line); }
.crew .h { grid-column: 1 / -1; font-size: 11px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }

.legal { max-width: 720px; padding-block: 24px 96px; }
.legal h4 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }

.legal h5 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; margin: 28px 0 8px; }

.notes .shop { justify-self: start; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #fff; background: var(--fg); border: 1px solid var(--fg); padding: 14px 20px; }
.notes .shop:hover { background: #fff; color: var(--fg); }
/* Press wall: outlet wordmarks + pull quotes scattered across the page in mixed sizes and faces */
.wall { max-width: 1200px; margin-top: 56px; }
.wall > .label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; padding-bottom: 10px; border-bottom: 1px solid var(--fg); }
.wall .lead { display: block; padding: 48px 0 40px; border-bottom: 1px solid var(--line); }

.wall .cols { columns: 3 280px; column-gap: 48px; padding-top: 36px; }

.clip.f2 q { font-family: var(--mono); font-size: 14px; line-height: 1.55; }
.clip.f3 q { font-family: "Playfair Display", Georgia, serif; font-style: italic; font-weight: 700; font-size: 24px; line-height: 1.2; }
.clip.f4 q { font-family: "Bebas Neue", Impact, sans-serif; font-size: 36px; line-height: 1; letter-spacing: .01em; }

.lg { display: inline-flex; align-items: center; color: var(--fg); line-height: 1; white-space: nowrap; }
.lg svg { height: .95em; width: auto; fill: currentColor; }

.project .watch { display: inline-flex; gap: 8px; margin-top: 16px; font-size: 13px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; border-bottom: 1px solid var(--fg); padding-bottom: 2px; }
.parts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

@font-face { font-family: "VCR OSD Mono"; src: url("fonts/vcr-osd-mono.ttf") format("truetype"); font-display: swap; }
:root { --vcr: "VCR OSD Mono", var(--mono); }
/* reel as the page background on the homepage */
.top { position: relative; }
.is-home header { position: absolute; inset: 0 0 auto; z-index: 3; color: #fff; }

.is-home #hero { display: block; }
.bg-reel { position: relative; height: max(520px, 92svh); overflow: hidden; background: #0b0c0d; color: #fff; margin-bottom: 40px; }
.bg-reel .footage { position: absolute; inset: -10%; background:
  radial-gradient(40% 50% at 30% 40%, rgba(214,150,96,.55), transparent 70%),
  radial-gradient(45% 55% at 75% 60%, rgba(60,105,150,.6), transparent 70%),
  radial-gradient(30% 40% at 60% 20%, rgba(170,60,90,.4), transparent 70%), #121316;
  animation: drift 18s ease-in-out infinite alternate; }
.bg-reel .footage.b { mix-blend-mode: screen; opacity: .6; animation-duration: 11s; animation-direction: alternate-reverse;

  "cliche": {"artist": "mgk", "blurb": "mgk's first fully choreographed video, with moves by Sean Bankhead, has him dancing through a car wash, on the back of a moving truck and in a motel parking lot. The lead single from Lost Americana went Gold in Canada.", "credit": "Directed by Sam Cahill", "accolades": [{"text": "Song peaked at No. 62 on the Billboard Hot 100, No. 10 on Hot Rock & Alternative Songs and No. 17 on Pop Airplay", "url": "https://en.wikipedia.org/wiki/Clich%C3%A9_(Machine_Gun_Kelly_song)"}, {"text": "Certified Gold in Canada (Music Canada)", "url": "https://en.wikipedia.org/wiki/Clich%C3%A9_(Machine_Gun_Kelly_song)"}], "press": [{"outlet": "Uproxx", "headline": "MGK Is Like A Rolling Stone In The Heavily Choreographed ‘Cliché’ Video", "url": "https://uproxx.com/music/mgk-cliche-video/", "quote": "Think: a more earnest 'All The Small Things' music video, minus the fake teeth."}, {"outlet": "HotNewHipHop", "headline": "Machine Gun Kelly Responds To Homophobic Backlash Over His New Pop Single \"Cliché\"", "url": "https://www.hotnewhiphop.com/914738-maching-gun-kelly-cliche-response-hip-hop-news", "quote": "his latest single \"Cliché\" is an attempt to bridge the gap and become a full-on pop star."}, {"outlet": "UPI", "headline": "Watch: MGK releases 'Cliche,' music video Friday", "url": "https://www.upi.com/Entertainment_News/Music/2025/05/23/MGK-cliche-music-video/6051748005017/", "quote": "The video shows him dancing in a car wash, on the back of a moving truck and in a motel parking lot."}, {"outlet": "Melodic Magazine", "headline": "mgk debuts song of the summer, \"cliché\"", "url": "https://www.melodicmag.com/news/mgk-debuts-song-of-the-summer-cliche/", "quote": "The single is accompanied by a music video directed by Sam Cahill that features a new layer of excitement."}, {"outlet": "That Eric Alper", "headline": "MGK Drops Nostalgic New Single “Cliché” With Video Directed By Sam Cahill", "url": "https://www.thatericalper.com/2025/05/23/mgk-drops-nostalgic-new-single-cliche-with-video-directed-by-sam-cahill/", "quote": "Layered with emotion and cinematic sonics, the video directed by Sam Cahill, captures an irresistible carefree side of mgk."}, {"outlet": "antiMusic", "headline": "mgk Delivers 'Cliche' Video", "url": "https://musicpressbox.antimusic.com/25/0523mgk_delivers_cliche_video.shtml", "quote": "fans are taken on a nostalgic alternative journey, which was brough to life by famed choreographer Sean Bankhead"}, {"outlet": "The Music Universe", "headline": "Machine Gun Kelly debuts ‘Cliche’", "url": "https://themusicuniverse.com/machine-gun-kelly-debuts-cliche/", "quote": "Layered with emotion and cinematic sonics, the video directed by Sam Cahill, captures an irresistible carefree side of mgk."}]},
  "miss-sunshine": {"artist": "mgk", "blurb": "mgk and his band tower like giants over a meticulously crafted miniature world, a carefree, psychedelic-tinged visual for this Lost Americana track.", "credit": "Directed by Sam Cahill", "press": [{"outlet": "The Music Universe", "headline": "MGK releases carefree 'Miss Sunshine'", "url": "https://themusicuniverse.com/mgk-releases-carefree-miss-sunshine/", "quote": "The Sam Cahill-directed video showcases MGK and his band as giants in a meticulously crafted miniature world,"}, {"outlet": "The Luna Collective", "headline": "REVIEW: MGK Hits Cruise Control in “miss sunshine” on the Road to “lost americana”", "url": "https://www.thelunacollective.co/journal/review-mgk-miss-sunshine", "quote": "the Sam Cahill-directed video is a psychedelic toybox of miniature Americana."}, {"outlet": "That Eric Alper", "headline": "MGK Unleashes “miss sunshine,” a Psychedelic Slice of Lost Americana Ahead of New Album", "url": "https://www.thatericalper.com/2025/07/25/mgk-unleashes-miss-sunshine-a-psychedelic-slice-of-lost-americana-ahead-of-new-album/", "quote": "showcases mgk and his band as giants in a meticulously crafted miniature world"}, {"outlet": "METALOCUS", "headline": "Positive trip. \"miss sunshine\" by mgk", "url": "https://www.metalocus.es/en/news/positive-trip-miss-sunshine-mgk", "quote": "The music video, directed by Sam Cahill, visually reinforces this free-spirited and psychedelic vibe."}, {"outlet": "antiMusic", "headline": "Watch mgk's 'Miss Sunshine' Video", "url": "https://musicpressbox.antimusic.com/25/0725watch_mgks_miss_sunshine_video.shtml", "quote": "which perfectly complements the song's carefree, psychedelic-tinged vibe."}]},
  "crash-first": {"artist": "honestav & mgk", "blurb": "honestav and mgk's emotional collaboration from honestav's album Sweet American Boy, with a video shot on mgk's Australia and New Zealand tour, where honestav was his opening act.", "credit": "Directed by Sam Cahill", "press": [{"outlet": "RTTNews", "headline": "MGK Joins Honestav On New Single 'Crash First'", "url": "https://www.rttnews.com/3661280/mgk-joins-honestav-on-new-single-crash-first.aspx?type=rk", "quote": "The release arrives alongside a music video shot during MGK's recent Australia and New Zealand tour"}, {"outlet": "Billboard Canada", "headline": "honestav On His New Collab with mgk and His Viral Missed Concert Moment in Toronto: Interview", "url": "https://ca.billboard.com/music/honestav-mgk-interview", "quote": "They recorded \"Crash First\" at mgk's house after a heavy touring schedule for mgk."}, {"outlet": "ABC Audio", "headline": "Mgk releases new song 'Crash First' with honestav", "url": "https://digital.abcaudio.com/news/mgk-releases-new-song-crash-first-honestav", "quote": "The track begins with mgk and honestav trading verses over an acoustic guitar"}, {"outlet": "Rockum", "headline": "honestav and mgk Release 'Crash First' Video Ahead of 'Sweet American Boy' Album", "url": "https://www.rockumweb.com/reportes/2198/honestav-and-mgk-release-crash-first-video-ahead-of-sweet-american-boy-album", "quote": "The accompanying music video was directed by Sam Cahill"}, {"outlet": "antiMusic", "headline": "Watch honestav and mgk's 'Crash First' Video", "url": "https://musicpressbox.antimusic.com/26/p0613watch_honestav_and_mgks_crash_first_video.shtml", "quote": "arrives alongside a music video shot during mgk's recent Australia and New Zealand tour"}]},
  "iris": {"artist": "mgk feat. Julia Wolf", "blurb": "mgk and Julia Wolf turn the Goo Goo Dolls' 1998 classic 'Iris' into a heavier-guitared duet, paying homage to the original with live instrumentation.", "press": [{"outlet": "Parade", "headline": "Fans Are Losing Their Minds Over Rap/Rocker's 'Beautiful' Cover of This '90s Classic", "url": "https://parade.com/news/fans-are-losing-their-minds-over-rap-rockers-beautiful-cover-of-this-90s-classic", "quote": "The artist shared the new video for his version of the song on Instagram on May 13 and his fans are loving it."}, {"outlet": "Uproxx", "headline": "Machine Gun Kelly Covers One Of The Most Popular Songs Of The 1990s, 'Iris' By The Goo Goo Dolls", "url": "https://uproxx.com/indie/maching-gun-kelly-iris-cover-goo-goo-dolls/", "quote": "he and singer Julia Wolf have covered The Goo Goo Dolls’ heartfelt ballad"}, {"outlet": "ABC Audio", "headline": "He just wants you to know who he is: mgk covers the Goo Goo Dolls Iris", "url": "https://www.planet939.com/news/daily-planet/he-just-wants-you-to-know-who-he-is-mgk-covers-the-goo-goo-dolls-iris", "quote": "The cover is faithful to the original, except, of course, it's done as a duet and the guitars are a lot heavier."}, {"outlet": "The Music Universe", "headline": "Machine Gun Kelly reimagines Goo Goo Dolls' 'Iris' with Julia Wolf", "url": "https://themusicuniverse.com/machine-gun-kelly-reimagines-goo-goo-dolls-iris-with-julia-wolf/", "quote": "paying homage to the original version through live instrumentation"}]},
  "jimmy-kimmel-2021": {"artist": "mgk", "blurb": "A one-man band on Jimmy Kimmel Live!, mgk tears through 'drunk face,' 'all i know' and 'bloody valentine' from Tickets to My Downfall in three minutes on a bright pink piano, guitar and sampler.", "press": [{"outlet": "NME", "headline": "Watch Machine Gun Kelly perform a medley of 'Tickets To My Downfall' songs on 'Kimmel'", "url": "https://www.nme.com/news/music/watch-machine-gun-kelly-perform-medley-ickets-to-my-downfall-songs-2851997", "quote": "Appearing as a one-man band, Colson Baker ripped through three songs in three minutes"}, {"outlet": "Alternative Press", "headline": "Watch MGK play all the instruments in this 'Tickets To My Downfall' medley", "url": "https://www.altpress.com/?p=184661", "quote": "rather than rocking out with Travis Barker, MGK turned into a one-man band for an acoustic medley performance."}, {"outlet": "uDiscover Music", "headline": "Watch Machine Gun Kelly Perform On 'Jimmy Kimmel Live'", "url": "https://www.udiscovermusic.com/news/machine-gun-kelly-kimmel-live/", "quote": "He was a one-man band for the rendition, performing with a bright pink piano, guitar and sampler."}, {"outlet": "iHeartRadio (DC101)", "headline": "Machine Gun Kelly On 'Jimmy Kimmel Live!'", "url": "https://dc101.iheart.com/alternate/amp/2021-01-05-machine-gun-kelly-on-jimmy-kimmel-live/", "quote": "the pink piano, guitar and drum machine"}]},
  "lost-boys": {"artist": "mgk x Trippie Redd", "blurb": "Under a starry night sky, mgk and Trippie Redd trade verses on the anthemic emo lead single from their joint project genre : sadboy.", "credit": "Directed by Sam Cahill", "press": [{"outlet": "UPI", "headline": "Listen: Machine Gun Kelly, Trippie Redd release 'Lost Boys' single, music video", "url": "https://www.upi.com/Entertainment_News/Music/2024/03/27/Machine-Gun-Kelly-Trippie-Redd-Lost-Boys/4661711548754/", "quote": "The 'Lost Boys' video shows Machine Gun Kelly and Trippie Redd sitting together under a starry night sky."}, {"outlet": "Hypebeast", "headline": "mgk and Trippie Redd Kick Off 'genre : sadboy' Rollout with \"lost boys\"", "url": "https://hypebeast.com/2024/3/mgk-machine-gun-kelly-trippie-redd-genre-sadboy-lost-boys-album-release-info", "quote": "An anthemic emo offering, “lost boys” clocks in at under three minutes."}, {"outlet": "Revolt", "headline": "mgk and Trippie Redd are \"lost boys\" on new single", "url": "https://www.revolt.tv/article/mgk-and-trippie-redd-are-lost-boys-on-new-single", "quote": "a Charlie Handsome and SlimXX-produced offering that mixed Redd's alternative melodies with mgk's emotionally charged raps."}, {"outlet": "Rock Sound", "headline": "Machine Gun Kelly And Trippie Redd Share 'Genre : Sadboy' Project", "url": "https://rocksound.tv/news/machine-gun-kelly-and-trippie-redd-share-genre-sadboy-project"}, {"outlet": "HotNewHipHop", "headline": "MGK & Trippie Redd Deliver Their Version Of An Emo Anthem On \"Lost Boys\"", "url": "https://www.hotnewhiphop.com/780350-mgk-trippie-redd-lost-boys-hip-hop-news", "quote": "This is the lead single for genre : sadboy, a 10-song project."}, {"outlet": "Audacy", "headline": "Machine Gun Kelly, Trippie Redd link up for 'genre: sadboy' collab EP", "url": "https://www.audacy.com/y98/news/machine-gun-kelly-trippie-redd-link-up-for-genre-sadboy", "quote": "Starting with their pensive single, 'lost boys,'"}, {"outlet": "Sportskeeda", "headline": "Breaking down MGK & Trippie Redd's first single 'LOST BOYS'", "url": "https://www.sportskeeda.com/pop-culture/breaking-mgk-trippie-redd-s-first-single-lost-boys", "quote": "The atmosphere captured by the Sam Cahill-directed video blends exceptionally well with the lyricism"}, {"outlet": "The Music Universe", "headline": "Machine Gun Kelly, Trippie Redd share 'Genre: Sadboy' EP", "url": "https://themusicuniverse.com/machine-gun-kelly-trippie-redd-share-genre-sadboy-ep/", "quote": "Earlier this week, they unveiled their first video, \"Lost Boys.\""}]},
  "don-t-let-me-go": {"artist": "mgk", "blurb": "A stripped-back, direct-to-camera performance: mgk opens at the piano, then moves through dark woods, under a bridge and in front of his hometown Cleveland skyline on his most confessional single in years.", "credit": "Directed by Sam Cahill", "accolades": [{"text": "Song peaked at No. 76 on the Billboard Hot 100", "url": "https://en.wikipedia.org/wiki/Don%27t_Let_Me_Go_(Machine_Gun_Kelly_song)"}], "press": [{"outlet": "Billboard", "headline": "Machine Gun Kelly Admits He Had a ‘Breakdown’ Before Getting Jarring Tattoo in ‘Dont Let Me Go’ Video: Watch", "url": "https://www.yahoo.com/entertainment/machine-gun-kelly-admits-had-231403424.html", "quote": "The clip is kept simple for the most part"}, {"outlet": "Complex", "headline": "Machine Gun Kelly Raps About Miscarriage With Megan Fox on New Song \"Don't Let Me Go\"", "url": "https://www.complex.com/music/a/alex-ocho/machine-gun-kelly-megan-fox-miscarriage-dont-let-me-go", "quote": "MGK premiered his latest single \"Don't Let Me Go\" on Wednesday with an accompanying music video."}, {"outlet": "E! News", "headline": "Machine Gun Kelly reveals the truth behind his blackout tattoo", "url": "https://www.nbcnewyork.com/entertainment/entertainment-news/machine-gun-kelly-reveals-the-truth-behind-his-blackout-tattoo/5162316/", "quote": "shared the story behind his ink in a lyric from his new track 'Don't Let Me Go.'"}, {"outlet": "Revolt", "headline": "Machine Gun Kelly returns to his roots in \"dont let me go\" clip", "url": "https://www.revolt.tv/article/machine-gun-kelly-returns-to-his-roots-in-dont-let-me-go-video", "quote": "The accompanying clip for \"dont let me go\" was directed by Sam Cahill"}, {"outlet": "HotNewHipHop", "headline": "MGK Reveals Painful Truths About His Life On \"Don't Let Me Go\"", "url": "https://www.hotnewhiphop.com/766385-dont-let-me-go-mgk-hip-hop-news", "quote": "The visuals are also a nice touch as it shows some shots of him in front of downtown Cleveland's skyline."}, {"outlet": "HipHopDX", "headline": "Machine Gun Kelly Pours His Heart Out On New Track, Says 'Breakdown' Inspired New Tattoo", "url": "https://hiphopdx.com/news/machine-gun-kelly-new-track-breakdown-inspired-tattoo-listen", "quote": "the Cleveland star shared a music video for the new track."}, {"outlet": "RTTNews", "headline": "Machine Gun Kelly Reveals 'Breakdown' In New Song 'Dont Let Me Go'", "url": "https://www.rttnews.com/3427019/machine-gun-kelly-reveals-breakdown-in-new-song-dont-let-me-go.aspx", "quote": "arrived recently along with a video"}]},
  "girl-next-door": {"artist": "mgk & Wiz Khalifa", "blurb": "A blog-era throwback co-directed with Power actor Gianni Paolo: roommates mgk and Wiz Khalifa scheme to impress the two women who just moved in next door, with Lindsey Fishman, Naomi Baker and Trevor Wallace.", "credit": "Directed by Sam Cahill & Gianni Paolo", "accolades": [{"text": "Peaked at No. 36 on Billboard's US Rhythmic Airplay chart", "url": "https://en.wikipedia.org/wiki/Girl_Next_Door_(MGK_and_Wiz_Khalifa_song)"}, {"text": "Peaked at No. 44 on Billboard's US Hot Rock & Alternative Songs chart", "url": "https://en.wikipedia.org/wiki/Girl_Next_Door_(MGK_and_Wiz_Khalifa_song)"}, {"text": "Peaked at No. 38 on New Zealand's Hot Singles chart", "url": "https://en.wikipedia.org/wiki/Girl_Next_Door_(MGK_and_Wiz_Khalifa_song)"}], "press": [{"outlet": "uDiscover Music", "headline": "mgk and Wiz Khalifa Team Up For New Single 'girl next door'", "url": "https://www.udiscovermusic.com/news/mgk-wiz-khalifa-girl-next-door/", "quote": "The video ends with the two artists approaching the door of their crushes."}, {"outlet": "Complex", "headline": "MGK and Wiz Khalifa Reunite for 'Girl Next Door' and Tease Blog Era Comeback", "url": "https://www.complex.com/music/a/markelibert/mgk-wiz-khalifa-girl-next-door", "quote": "MGK and Wiz play roommates attempting to impress two women who have just moved in next door."}, {"outlet": "HotNewHipHop", "headline": "Girl Next Door - Song by mgk & Wiz Khalifa", "url": "https://www.hotnewhiphop.com/994602-girl-next-door-mgk-wiz-khalifa", "quote": "this is a track that blends hip-hop with pop punk"}, {"outlet": "antiMusic", "headline": "Watch mgk and Wiz Khalifa's 'Girl Next Door' Video", "url": "https://musicpressbox.antimusic.com/26/p0513watch_mgk_and_wiz_khalifas_girl_next_door_video.shtml", "quote": "directed by mgk's longtime videographer Sam Cahill alongside Gianni Paolo"}, {"outlet": "The Music Universe", "headline": "Machine Gun Kelly, Wiz Khalifa drop 'Girl Next Door'", "url": "https://themusicuniverse.com/machine-gun-kelly-wiz-khalifa-drop-girl-next-door/", "quote": "That kindred spirit carries over into the “Girl Next Door” video."}, {"outlet": "RTTNews", "headline": "Mgk, Wiz Khalifa Drop Joint Single 'girl Next Door'", "url": "https://www.rttnews.com/3652904/mgk-wiz-khalifa-drop-joint-single-girl-next-door.aspx", "quote": "The \"girl next door\" video was directed by mgk's longtime videographer Sam Cahill alongside Gianni Paolo"}, {"outlet": "ChucksConnection", "headline": "\"girl next door\" by mgk and Wiz Khalifa", "url": "https://chucksconnection.com/video379.html", "quote": "The music video has good vibes and really does harken back to the blog era of music videos."}]},
  "your-name-forever": {"artist": "mgk (feat. Oli Sykes, M. Shadows, Synyster Gates, Mod Sun)", "blurb": "mgk's rap-rock tribute to late friend Luke 'The Dingo' Trembath, framing a rooftop performance above the Hollywood Hills with archive footage of the pair and a larger-than-life mural of Dingo.", "credit": "Directed by Sam Cahill", "press": [{"outlet": "NME", "headline": "Machine Gun Kelly pays tribute to Luke 'Dingo' Trembath on bittersweet single 'Your Name Forever' – featuring Oli Sykes and Avenged Sevenfold", "url": "https://www.nme.com/news/music/machine-gun-kelly-pays-tribute-to-luke-dingo-trembath-on-bittersweet-single-your-name-forever-featuring-oli-sykes-and-avenged-sevenfold-3847644", "quote": "celebrating the life of the extreme sports legend with a series of clips of Dingo over the years"}, {"outlet": "Kerrang!", "headline": "mgk shares Luke 'Dingo' Trembath tribute single featuring Oli Sykes, Avenged Sevenfold and MOD SUN", "url": "https://www.kerrang.com/machine-gun-kelly-mgk-your-name-forever-luke-dingo-trembath-avenged-sevenfold-m-shadows-synyster-gates-bring-me-the-horizon-oli-sykes", "quote": "mgk has released a powerful new Linkin Park-esque rap-rock single, your name forever, in tribute to the late Luke ‘Dingo’ Trembath"}, {"outlet": "TMZ", "headline": "Machine Gun Kelly Pens Rock-Rap Tribute to Luke 'The Dingo' Trembath", "url": "https://www.tmz.com/2025/03/18/machine-gun-kelly-luke-the-dingo-trembath-your-name-forever/", "quote": "uses splices of scenes from Dingo's funeral"}, {"outlet": "Knotfest", "headline": "MGK Shares Emotional Tribute to Luke 'The Dingo' Trembath", "url": "https://knotfest.com/blogs/news/mgk-shares-emotional-tribute-to-luke-the-dingo-trembath", "quote": "Framing an energetic live performance with archive footage of MGK and The Dingo sharing laughs backstage"}, {"outlet": "Melodic Magazine", "headline": "mgk pays tribute to late friend Luke 'The Dingo' Trembath in heartfelt new song, \"your name forever\"", "url": "http   "jjk": {"artist": "mgk & Yuki Chiba", "blurb": "mgk and Japanese rapper Yuki Chiba roam Japanese-inspired temples in a black-and-white video, mgk in yellow and Chiba in red, on an anime-stuffed track. It hit No. 4 on YouTube's US trending chart.", "credit": "Directed by Sam Cahill", "accolades": [{"text": "Video reached No. 4 on YouTube trending in the US (also No. 6 Canada, No. 22 Australia, No. 24 UK, No. 28 Japan) per a July 29, 2026 Kworb snapshot", "url": "https://www.musictimes.com/articles/112437/20260729/mgk-yuki-chiba-release-joint-single-jjk-video-climbs-youtube-trends-us-japan.htm"}], "press": [{"outlet": "Complex", "headline": "MGK Reminds Everyone He's the 'Rap Devil' on New Track 'JKK' With Yuki Chiba", "url": "https://www.complex.com/music/a/will-lavin/mgk-machine-gun-kelly-yuki-chiba-jjk-track-listen", "quote": "a fun music video that sees the MGK and Chiba in yellow and red respectively, while the rest of the visual is shot in black and white."}, {"outlet": "uDiscover Music", "headline": "mgk and Yuki Chiba Team Up For New Single 'JJK'", "url": "https://www.udiscovermusic.com/news/mgk-yuki-chiba-jjk/", "quote": "a music video directed by Sam Cahill that features the duo exploring Japanese-inspired temples."}, {"outlet": "Music Times", "headline": "MGK and Yuki Chiba Release Joint Single 'JJK,' Video Climbs YouTube Trends in the U.S. and Japan", "url": "https://www.musictimes.com/articles/112437/20260729/mgk-yuki-chiba-release-joint-single-jjk-video-climbs-youtube-trends-us-japan.htm", "quote": "follows the two artists through a Japanese-inspired temple setting alongside performance footage"}, {"outlet": "RTTNews", "headline": "MGK, Yuki Chiba Team Up On New Single 'JJK'", "url": "https://www.rttnews.com/story.aspx?Id=3674072", "quote": "The visual finds the two singers roaming through a Japanese-inspired temple."}, {"outlet": "The Music Universe", "headline": "Machine Gun Kelly, Yuki Chiba unite for 'JJK'", "url": "https://themusicuniverse.com/machine-gun-kelly-yuki-chiba-unite-for-jjk/", "quote": "available now alongside its official music video, directed by Sam Cahill."}]},
  "pressure": {"artist": "mgk (Machine Gun Kelly)", "blurb": "Shot primarily in Cleveland, mgk takes stock of his career with dancers from World of Dance champions Elevated Crew, burnouts outside a liquor store, a gold throne and a cameo from Pete Davidson.", "credit": "Directed by Sam Cahill", "press": [{"outlet": "Rolling Stone", "headline": "Machine Gun Kelly Contends With His Legacy on New Single 'Pressure'", "url": "https://www.rollingstone.com/music/music-news/machine-gun-kelly-new-single-pressure-music-viideo-1234743865/", "quote": "The song's Sam Cahill-directed music video features a cameo from Pete Davidson"}, {"outlet": "Billboard", "headline": "Machine Gun Kelly Takes Stock of Career on Intense 'Pressure' Single", "url": "https://www.billboard.com/music/rb-hip-hop/machine-gun-pressure-single-video-pete-davidson-1235342974/", "quote": "The visual ping-pongs between MGK and his dancers bopping down the city's streets"}, {"outlet": "NME", "headline": "Listen to Machine Gun Kelly's new single 'Pressure'", "url": "https://www.nme.com/news/music/listen-to-machine-gun-kellys-new-single-pressure-3449724", "quote": "'Pressure' arrives with an accompanying Sam Cahill-directed video"}, {"outlet": "uDiscover Music", "headline": "Machine Gun Kelly Turns Up The Heat On New Single 'Pressure'", "url": "https://www.udiscovermusic.com/news/machine-gun-kelly-pressure/", "quote": "was shot primarily in Cleveland and features former World of Dance champions Elevated Crew."}, {"outlet": "Songfacts", "headline": "Pressure by Machine Gun Kelly", "url": "https://www.songfacts.com/facts/machine-gun-kelly/pressure", "quote": "In the Sam Cahill-directed video, MGK returns to his roots in Cleveland."}, {"outlet": "ZiFM Stereo", "headline": "Machine Gun Kelly Unleashes New Single & Video, 'Pressure'", "url": "https://zifmstereo.co.zw/?p=16331", "quote": "was shot primarily in Cleveland and features former World of Dance champions Elevated Crew."}]},
  "the-sopranos": {"artist": "Tee Grizzley feat. mgk", "blurb": "Official video for \"The Sopranos,\" track 6 on Tee Grizzley's Tee's Coney Island, where mgk's verse was singled out as the album's highlight.", "accolades": [{"text": "Parent album Tee's Coney Island peaked at No. 65 on the Billboard 200 (album chart, not the video)", "url": "https://en.wikipedia.org/wiki/Tee%27s_Coney_Island"}], "press": [{"outlet": "Eagle Eye News", "headline": "[Review] Featured artists rescue Tee Grizzly's new album 'Tee's Coney Island'", "url": "https://eagleeye.news/29358/artsandleisure/review-featured-artist-rescue-tee-grizzlys-new-album-tees-coney-island/", "quote": "The highlight of the album is the verse from Machine Gun Kelly on \"The Sopranos (feat. Machine Gun Kelly).\""}, {"outlet": "The Source", "headline": "Tee Grizzley's New Album: Tee's Coney Island", "url": "https://thesource.com/?p=701320", "quote": "as well as songs with Machine Gun Kelly, Mariah the Scientist, and Finesse2Tymes."}, {"outlet": "The Source", "headline": "Tee Grizzley Drops His New Album 'Tee's Coney Island'", "url": "https://thesource.com/?p=700655", "quote": "Additional features include SKilla Baby, Mariah the Scientist, Machine Gun Kelly, and City Girls."}]},
  "mgk-the-cypher-and-cover-songs": {"artist": "mgk (with Cordae, Doe Boy, No Love, YUNGBLUD)", "blurb": "mgk's backyard 'The Cypher' freestyles, from Central Cee's \"Doja\" with Cordae to a Jack Harlow-baiting \"Renegade,\" plus stripped-back covers like Zach Bryan's \"Sun to Me\" filmed in his living room. Doja and Renegade hit No. 2 and No. 5 on YouTube trending.", "accolades": [{"text": "\"Doja Freestyle\" with Cordae reached No. 2 overall on YouTube trending (No. 16 in music)", "url": "https://www.universalmusic.ca/press-releases/machine-gun-kelly-continues-to-apply-pressure-with-new-hard-hitting-video"}, {"text": "\"Renegade Freestyle\" reached No. 5 overall on YouTube trending (No. 8 in music)", "url": "https://www.universalmusic.ca/press-releases/machine-gun-kelly-continues-to-apply-pressure-with-new-hard-hitting-video"}], "press": [{"outlet": "Complex", "headline": "Machine Gun Kelly Recruits Cordae for New Freestyle Over Central Cee's \"Doja\"", "url": "https://www.complex.com/music/a/tracewilliamcowen/machine-gun-kelly-cordae-doja-freestyle-video", "quote": "The clip sees MGK and Cordae going in over the beat to Central Cee's \"Doja,\""}, {"outlet": "Complex", "headline": "Machine Gun Kelly Disses Jack Harlow in \"Renegade Freestyle,\" Tells Him to Give Drake His Flow Back", "url": "https://www.complex.com/music/a/markelibert/machine-gun-kelly-jack-harlow-diss-renegade-freestyle", "quote": "In another episode of The Cypher, Machine Gun Kelly kicks another freestyle over Jay-Z and Eminem's \"Renegade\" beat."}, {"outlet": "TMZ", "headline": "MGK and Cordae Freestyle in British Accents Over Central Cee's 'Doja' Beat", "url": "https://www.tmz.com/2023/04/26/mgk-cordae-freestyle-british-accents-central-cees-doja-beat/", "quote": "a new freestyle over Central Cee's \"Doja\" where he invited Cordae to his backyard to tag along"}, {"outlet": "ET Online", "headline": "Machine Gun Kelly Seemingly Disses Jack Harlow in New 'Renegade Freestyle' Rap", "url": "https://www.etonline.com/machine-gun-kelly-seemingly-disses-jack-harlow-in-new-renegade-freestyle-rap-204190", "quote": "The rocker released \"Renegade Freestyle\" on Saturday and fans on social media quickly pointed out that it was targeting Harlow."}, {"outlet": "REVOLT", "headline": "Machine Gun Kelly goes ballistic in new freestyle over JAY-Z's \"Renegade\"", "url": "https://revolt.tv/article/2023-05-08/300873/machine-gun-kelly-jay-z-eminem-renegade-freestyle", "quote": "began with a dope freestyle alongside Cordae over Central Cee's \"Doja.\""}, {"outlet": "HotNewHipHop", "headline": "Machine Gun Kelly Raps Over JAY-Z & Eminem's \"Renegade\" In New Freestyle", "url": "https://www.hotnewhiphop.com/672348-machine-gun-kelly-jay-z-eminems-renegade-freestyle", "quote": "He also introduced the song by explaining that he was recording it in a friend's backyard."}, {"outlet": "HipHopDX", "headline": "MGK Flips *NSYNC Classic On New Freestyle", "url": "https://hiphopdx.com/news/mgk-nsync-bye-bye-bye-freestyle", "quote": "Alongside producer/writer No Love on the keys, Kells manned the MPC"}, {"outlet": "The Tennessean", "headline": "MGK covers Zach Bryan; is he the latest rap-rocker headed to Nashville?", "url": "https://www.aol.com/mgk-covers-zach-bryan-latest-195616687.html", "quote": "recorded at Cheshire Cottage, aka the living room of his home in Encino, California."}, {"outlet": "Whiskey Riff", "headline": "MGK Throws Fans A Curveball & Releases Cover Of Zach Bryan's 'Sun to Me'", "url": "https://www.whiskeyriff.com/2024/06/26/mgk-throws-fans-a-curveball-releases-cover-of-zach-bryans-sun-to-me/", "quote": "the production is more than what is on Zach's original"}, {"outlet": "Audacy", "headline": "Machine Gun Kelly has fans wondering 'what's next' after sharing Country cover", "url": "https://www.audacy.com/national/music/mgk-has-fans-wondering-whats-next-with-country-cover", "quote": "The Alternative Rocker/Rapper gave fans a glimpse at his Country side with a cover of Zach Bryan’s track \"Sun To Me,\""}, {"outlet": "The Music Universe", "headline": "MGK covers Zach Bryan", "url": "https://themusicuniverse.com/mgk-covers-zach-bryan/", "quote": "MGK (Machine Gun Kelly) invites fans inside his living room at Cheshire Cottage for an intimate performance"}], "parts": ["Doja Freestyle ft. Cordae", "Killa Cam Freestyle ft. Doe Boy", "Renegade Freestyle", "Empty Out Your Pockets x Boulevard of Broken Dreams", "Bye Bye Bye Freestyle ft. No Love", "I Think I'm OKAY (Sad Version) ft. YUNGBLUD", "Come Pick Me Up (Cover)", "Sun to Me (Zach Bryan Cover)"]},
  "mod-sun-stay-away": {"artist": "Mod Sun feat. Machine Gun Kelly", "blurb": "A stripped-back piano version of Mod Sun and Machine Gun Kelly's \"Stay Away,\" performed in Mod Sun's studio.", "credit": "Shot and edited by Sam Cahill", "press": [{"outlet": "Alternative Press", "headline": "See Mod Sun and Machine Gun Kelly reimagine their collab \"Stay Away\"", "url": "https://www.altpress.com/mod-sun-machine-gun-kelly-stay-away-piano-version/", "quote": "Shot by Sam Cahill, the \"Stay Away (Piano Version)\" video was filmed in Mod Sun's studio."}]},
  "taurus": {"artist": "Machine Gun Kelly feat. Naomi Wild", "blurb": "Title track from Tim Sutton's semi-autobiographical film Taurus, starring Colson Baker; the video flashes between Baker rapping and scenes from the movie, with co-star Naomi Wild.", "accolades": [{"text": "Colson Baker's performance in the film Taurus won a Spotlight Award at Newport Beach Film Festival Honors, a Discovery Award at San Diego International Film Festival and a Spotlight Award at SCAD Savannah Film Festival (film acting awards, not for the video)", "url": "https://universalmusic.ca/press-releases/machine-gun-kelly-releases-new-song-and-video-taurus-featuring-naomi-wild-from-the-soundtrack-of-the-feature-film-taurus"}], "press": [{"outlet": "Uproxx", "headline": "Machine Gun Kelly Gets In His Rap Bag For 'Taurus,' The Title Track From His New Movie", "url": "https://uproxx.com/music/machine-gun-kelly-taurus/", "quote": "The accompanying video features clips from the movie."}, {"outlet": "Rolling Stone", "headline": "Machine Gun Kelly Drops Title Track From Semi-Autobiographic Movie 'Taurus'", "url": "https://www.rollingstone.com/music/music-news/machine-gun-kelly-taurus-song-1234636313/"}, {"outlet": "Hypebeast", "headline": "Machine Gun Kelly Delivers Title Track From Semi-Autobiographical Film 'Taurus'", "url": "https://hypebeast.com/2022/11/machine-gun-kelly-new-track-video-taurus"}, {"outlet": "uDiscover Music", "headline": "Watch The Video For Machine Gun Kelly's 'Taurus' Ft. Naomi Wild", "url": "https://udiscovermusic.com/news/machine-gun-kelly-taurus-naomi-wild-video"}, {"outlet": "Universal Music Canada", "headline": "Machine Gun Kelly releases new song and video \"Taurus\" featuring Naomi Wild from the soundtrack of the feature film Taurus", "url": "https://universalmusic.ca/press-releases/machine-gun-kelly-releases-new-song-and-video-taurus-featuring-naomi-wild-from-the-soundtrack-of-the-feature-film-taurus", "quote": "receiving several key industry awards along the way including the Spotlight Award at the Newport Beach Film Festival Honors"}]},
  "9-lives": {"artist": "mgk (Machine Gun Kelly)", "blurb": "A behind-the-scenes ride through mgk's 2022 Mainstream Sellout world tour, mixing performance footage with backstage hangs alongside Avril Lavigne and Iann Dior.", "credit": "Directed by Sam Cahill", "press": [{"outlet": "NME", "headline": "Machine Gun Kelly hits the road in new '9 Lives' video", "url": "https://www.nme.com/news/music/machine-gun-kelly-hits-the-road-in-new-9-lives-video-3328849", "quote": "the new video mixes performance footage with shots of Kelly and his band backstage."}, {"outlet": "uDiscover Music", "headline": "Machine Gun Kelly Hits The Road In Vibrant '9 Lives' Video", "url": "https://www.udiscovermusic.com/news/machine-gun-kelly-9-lives-video/", "quote": "Directed by Sam Cahill, the visuals show every angle of the superstar's life"}, {"outlet": "antiMusic", "headline": "Machine Gun Kelly Premieres '9 Lives' Video", "url": "https://www.antimusic.com/news/machine-gun-kelly-premieres-9-lives-video-101422/", "quote": "The clip was directed by Sam Cahill."}, {"outlet": "The Music Universe", "headline": "Machine Gun Kelly releases '9 Lives' video", "url": "https://themusicuniverse.com/machine-gun-kelly-releases-9-lives-video/", "quote": "Directed by Sam Cahill, MGK showcases every angle of his superstar life."}]},
  "daywalker": {"artist": "Machine Gun Kelly feat. CORPSE", "blurb": "A head-spinning six-part video with neon-blue-haired mgk and streamer Valkyrae standing in for the faceless CORPSE. It drew 1.2 million views in five hours, and the song made the Billboard Hot 100.", "credit": "Directed by Machine Gun Kelly and Sam Cahill", "accolades": [{"text": "Song debuted at No. 88 on the Billboard Hot 100 and peaked at No. 8 on Hot Rock & Alternative Songs; No. 53 on the UK Singles Chart", "url": "https://en.wikipedia.org/wiki/DayWalker_(song)"}, {"text": "Video drew 1.2 million views in its first five hours", "url": "https://themusicuniverse.com/machine-gun-kelly-corpse-husband-release-daywalker-video/"}], "press": [{"outlet": "NME", "headline": "Machine Gun Kelly teams up with YouTuber Corpse Husband on 'Daywalker!' video", "url": "https://www.nme.com/news/music/machine-gun-kelly-teams-up-with-youtuber-corpse-husband-on-daywalker-video-2904204", "quote": "Machine Gun Kelly has teamed up with YouTube star Corpse Husband to debut the unsettling video for 'Daywalker!'."}, {"outlet": "Kerrang!", "headline": "Machine Gun Kelly and CORPSE release gripping, intense new video for DAYWALKER!", "url": "https://www.kerrang.com/machine-gun-kelly-and-corpse-release-gripping-intense-new-video-for-daywalker", "quote": "Directed by MGK and Sam Cahill"}, {"outlet": "uDiscover Music", "headline": "Machine Gun Kelly Releases Music Video For \"DAYWALKER!\" With CORPSE", "url": "https://www.udiscovermusic.com/news/machine-gun-kelly-music-video-release/", "quote": "is a head-spinning ride comprised of 6 parts"}, {"outlet": "Dexerto", "headline": "Valkyrae is Corpse Husband in brand new MGK 'DAYWALKER!' video", "url": "https://www.dexerto.com/entertainment/valkyrae-teases-cameo-in-corpsehusband-and-mgk-music-video-1535742/", "quote": "Valkyrae ran through Corpse's lines in the DAYWALKER! video, essentially becoming the shrouded streamer."}, {"outlet": "Dexerto", "headline": "Valkyrae explains how MGK picked her for Corpse Husband Daywalker video", "url": "https://www.dexerto.com/entertainment/valkyrae-reveals-mgk-personally-picked-her-corpse-husband-daywalker-video-1536471/", "quote": "MGK X CORPSE's video was everything fans expected and more."}, {"outlet": "iHeartRadio (104.7 KISS FM)", "headline": "Streamer Valkyrae Plays CORPSE in New Music Video With Machine Gun Kelly!", "url": "https://1047kissfm.iheart.com/alternate/amp/2021-03-18-streamer-valkyrae-plays-corpse-in-new-music-video-with-machine-gun-kelly/", "quote": "streamer Valkyrae shocked everyone by playing Corpse!"}, {"outlet": "Upcomer", "headline": "Valkyrae stars in Machine Gun Kelly's DAYWALKER music video", "url": "https://upcomer.com/valkyrae-stars-in-machine-gun-kellys-daywalker-music-video/", "quote": "portrays Corpse Husband in Machine Gun Kelly's latest music video"}, {"outlet": "Sportskeeda", "headline": "Valkyrae stuns in \"Daywalker\" music video ft Corpse Husband and Machine Gun Kelly", "url": "https://sportskeeda.com/esports/valkyrae-stuns-daywalker-music-video-ft-corpse-husband-machine-gun-kelly", "quote": "Valkyrae was replete with a latex suit and red bionic eye akin to DC's Cyborg."}, {"outlet": "The Music Universe", "headline": "Machine Gun Kelly & Corpse Husband release 'Daywalker' video", "url": "https://themusicuniverse.com/machine-gun-kelly-corpse-husband-release-daywalker-video/", "quote": "co-stars the superstar esports personality Valkyrae from 100 Thieves."}]},
  "bullets-with-names": {"artist": "Machine Gun Kelly ft. Young Thug, RJMrLA & Lil Duke", "blurb": "MGK's return to rap gets a backstage-party visual cut from his previous year's tour footage, with Young Thug, RJMrLA and Lil Duke, snakes and all.", "credit": "Directed by Sam Cahill", "press": [{"outlet": "Hypebeast", "headline": "Machine Gun Kelly Shares Behind-the-Scenes Footage in \"Bullets With Names\" Visual", "url": "https://hypebeast.com/2020/3/machine-gun-kelly-bullets-with-names-young-thug-rjmrla-lil-duke-music-video", "quote": "the visual features behind-the-scenes footage of MGK and collaborators Young Thug, RJMrLA and Lil Duke."}, {"outlet": "REVOLT", "headline": "Machine Gun Kelly takes us behind the scenes for his \"Bullets With Names\" visual", "url": "https://revolt.tv/new-music/2020/3/17/21184122/machine-gun-kelly-bullets-with-names-video", "quote": "Now, the Wonda and Ronny J-produced track gets a new music video courtesy of Sam Cahill"}, {"outlet": "REVOLT", "headline": "Machine Gun Kelly returns with new single \"Bullets With Names\"", "url": "https://www.revolt.tv/article/2020-03-13/79591/machine-gun-kelly-returns-with-new-single-bullets-with-names", "quote": "Produced by Wonda and Ronny J, MGK lives up to his name by spitting fully automatic bars about lyrical homicide against his enemy."}, {"outlet": "Alternative Press", "headline": "Machine Gun Kelly, Young Thug live it up in \"Bullets With Names\" video", "url": "https://www.altpress.com/machine-gun-kelly-young-thug-bullets-with-names-video/", "quote": "The new song is called \"Bullets with Names\" and shows a return to the rap-oriented roots of which MGK hails."}, {"outlet": "HotNewHipHop", "headline": "Machine Gun Kelly & Young Thug Shine In \"Bullets With Names\" Video", "url": "https://www.hotnewhiphop.com/machine-gun-kelly-and-young-thug-shine-in-bullets-with-names-video-new-video.46060.html", "quote": "While straightforward, the high-energy clip imbues the clip with even more personality."}, {"outlet": "HotNewHipHop", "headline": "Machine Gun Kelly & Young Thug Get Back To Bars \"Bullets With Names\"", "url": "https://www.hotnewhiphop.com/242956-machine-gun-kelly-and-young-thug-get-back-to-bars-bullets-with-names-new-song", "quote": "finds MGK back on his BS, taking to some woodwinds and 808s like he never left."}]},
  "bloody-valentine-acoustic": {"artist": "Machine Gun Kelly (mgk)", "blurb": "A stripped-back take on the Tickets to My Downfall single: MGK rides his motorcycle up to a hilltop overlook and plays acoustic guitar at sunset over LA.", "credit": "Directed by Sam Cahill", "accolades": [{"text": "\"Bloody Valentine\" (the song) hit #1 on Billboard's Rock Digital Song Sales chart and #3 on Hot Rock Songs", "url": "https://www.universalmusic.ca/press-releases/machine-gun-kelly-releases-acoustic-video-version-of-bloody-valentine"}, {"text": "\"Bloody Valentine\" (the song) is certified 2x Platinum by the RIAA", "url": "https://en.wikipedia.org/wiki/Bloody_Valentine_(song)"}], "press": [{"outlet": "Essentially Pop", "headline": "Machine Gun Kelly Releases Acoustic Video Version of 'Bloody Valentine'", "url": "https://essentiallypop.com/epop/2020/06/machine-gun-kelly-releases-acoustic-video-version-of-bloody-valentine/", "quote": "While strumming on the acoustic guitar, the music video places Machine Gun Kelly on top of a breath-taking hilltop"}, {"outlet": "NME", "headline": "Watch Machine Gun Kelly's new video for acoustic version of Travis Barker collaboration 'Bloody Valentine'", "url": "https://www.nme.com/news/music/machine-gun-kelly-bloody-valentine-acoustic-version-video-travis-barker-collaboration-2690186", "quote": "sees Kelly playing guitar while looking out at a sunset over the city of LA."}, {"outlet": "Kerrang!", "headline": "Machine Gun Kelly Releases Acoustic Version Of Bloody Valentine", "url": "https://www.kerrang.com/machine-gun-kelly-releases-acoustic-version-of-bloody-valentine", "quote": "Machine Gun Kelly is now stripping things right back with an acoustic version of his latest single, Bloody Valentine."}, {"outlet": "Loudwire", "headline": "Hear Machine Gun Kelly's Acoustic Version of Travis Barker-Backed 'Bloody Valentine'", "url": "https://loudwire.com/machine-gun-kelly-bloody-valentine-acoustic/", "quote": "wearing a leather jacket and seated on a   const n = [...name].reduce((h, c) => h + c.charCodeAt(0), 0);
  return `<span class="lg ${FACES[n % FACES.length]}">${esc(name)}</span>`;
}

document.addEventListener("submit", async e => {
  const f = e.target;
  if (f.id !== "book") return;
  e.preventDefault();
  const st = f.querySelector(".status"), btn = f.querySelector("button");
  if (!f.checkValidity()) { st.textContent = "Please add your name, a valid email and a message."; f.reportValidity(); return; }
  const data = Object.fromEntries(new FormData(f));
  if (data._honey) return;
  data._subject = `Booking request: ${data.project_type} from ${data.name}`;
  data._template = "table";
  data._replyto = data.email;
  btn.disabled = true; st.textContent = "Sending...";
  try {
    const r = await fetch(FORM_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(data) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.success === "false" || j.success === false) throw new Error(j.message || `HTTP ${r.status}`);
    f.reset(); st.textContent = "Thanks, your request was sent. Sam will be in touch.";
  } catch (err) {
    // FormSubmit explains problems (e.g. the one-time activation) in its message, so show it
    st.textContent = /activat/i.test(err.message) ? "This form is being activated. Please try again shortly, or email info@bottomcard.com directly."
      : `Something went wrong (${err.message}). Please email info@bottomcard.com directly.`;
    console.warn("Booking form:", err.message);
  } finally { btn.disabled = false; }
});

function route() {

  const i = W.findIndex(w => w.slug === h);
  const page = ["work", "contact", "gear", "about", "privacy"].includes(h) ? h : null;
  view.innerHTML = page === "work" ? work() : page === "privacy" ? privacy() : page === "contact" ? contact() : page === "gear" ? gear() : page === "about" ? about() : i >= 0 ? project(i) : home();
  document.title = i >= 0 ? `${W[i].name} | Sam Cahill` : page ? `${page[0].toUpperCase() + page.slice(1)} | Sam Cahill` : "Sam Cahill | Director, DoP, Editor & Photographer | Los Angeles";
  document.getElementById("nav-about").toggleAttribute("aria-current", h === "about");
  document.body.classList.toggle("is-home", !page && i < 0);
  document.getElementById("nav-work").toggleAttribute("aria-current", h === "work" || i >= 0);
  document.getElementById("nav-gear").toggleAttribute("aria-current", h === "gear");
  document.getElementById("nav-contact").toggleAttribute("aria-current", h === "contact");
  if (h) window.scrollTo(0, 0);
}

  if (part) { e.preventDefault(); const fr = view.querySelector(".project .frame"); fr.innerHTML = embed(part.dataset.part); fr.removeAttribute("data-yt"); fr.scrollIntoView({ behavior: "smooth", block: "center" }); }
});

// Intro: viewfinder focuses, shutter fires at ~2.2s, then the site is revealed
const intro = document.getElementById("intro");
let timers = [], raf;
function finish() {
  timers.forEach(clearTimeout); cancelAnimationFrame(raf);
  intro.classList.add("gone"); intro.classList.remove("click", "out");
}
function playIntro() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return finish();
  timers.forEach(clearTimeout); document.body.classList.remove("snapped");
  intro.className = ""; void intro.offsetWidth;
  intro.querySelectorAll(".vf-blur, .vf-reticle").forEach(el => { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; });
  const t0 = performance.now(), tc = document.getElementById("vf-tc");
  const tick = () => { const f = Math.floor((performance.now() - t0) / 1000 * 23.976);
    tc.textContent = `00:00:${String(Math.floor(f / 24)).padStart(2, "0")}:${String(f % 24).padStart(2, "0")}`; raf = requestAnimationFrame(tick); };
  tick();
  timers = [
    setTimeout(() => { cancelAnimationFrame(raf); intro.classList.add("click"); document.body.classList.add("snapped"); }, 2200),
    setTimeout(() => intro.classList.add("out"), 2650),
    setTimeout(finish, 3050)
  ];
}

// Project links are real /work/<slug>/ URLs for search engines; on the site they switch views without a reload
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="work/"]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  e.preventDefault();
  location.hash = a.getAttribute("href").split("/")[1];
});

// Video previews: play the tile's video muted from 30s in. Desktop starts one on
// a short hover; touch screens play whichever tile sits mid-screen while scrolling.
(function previews() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let timer, live;
  const stop = () => { clearTimeout(timer); if (live) { live.tile.classList.remove("previewing"); live.box.remove(); live = null; } };
  const start = (tile, delay) => {
    if (live && live.tile === tile) return;
    stop();
    timer = setTimeout(() => {
      const id = tile.dataset.prev, box = document.createElement("span");
      box.className = "prev";
      box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&controls=0&playsinline=1&loop=1&playlist=${id}&start=30&rel=0&disablekb=1&iv_load_policy=3&modestbranding=1" allow="autoplay; encrypted-media" tabindex="-1" title=""></iframe>`;
      box.querySelector("iframe").addEventListener("load", () => setTimeout(() => box.classList.add("on"), 900));
      tile.querySelector(".frame").append(box);
      tile.classList.add("previewing");
      live = { tile, box };
    }, delay);
  };
  window.addEventListener("hashchange", stop);

  if (matchMedia("(hover: hover) and (pointer: fine)").matches) {
    view.addEventListener("mouseover", e => { const tile = e.target.closest(".tile[data-prev]"); if (tile) start(tile, 250); });
    view.addEventListener("mouseout", e => { const t = e.target.closest(".tile"); if (t && !t.contains(e.relatedTarget)) stop(); });
    return;
  }

  // Touch: pick the tile closest to the middle of the screen once scrolling settles
  let queued = false;
  const pick = () => {
    queued = false;
    const mid = innerHeight / 2;
    let best = null, bestD = Infinity;
    for (const t of view.querySelectorAll(".tile[data-prev]")) {
      const r = t.getBoundingClientRect();
      if (r.bottom < mid - r.height || r.top > mid + r.height) continue;
      const d = Math.abs(r.top + r.height / 2 - mid);
      if (d < bestD && d < r.height * 0.75) { best = t; bestD = d; }
    }
    if (!best) { stop(); return; }
    if (!live || live.tile !== best) start(best, 350);
  };
  const queue = () => { if (!queued) { queued = true; requestAnimationFrame(pick); } };
  window.addEventListener("scroll", queue, { passive: true });
  window.addEventListener("resize", queue);
  window.addEventListener("hashchange", () => setTimeout(queue, 300));
})();

document.getElementById("vf-skip").addEventListener("click", finish);
let seen = false;
try { seen = sessionStorage.getItem("introSeen") === "1"; sessionStorage.setItem("introSeen", "1"); } catch (e) {}
seen ? finish() : playIntro();
