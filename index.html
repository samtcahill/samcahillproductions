<style>
/* Layout: gallery-white portfolio in the Brian Beckwith mold. Small logo left, two-word nav right, reel first, then an edge-to-edge grid of project tiles; each tile opens a project page with prev/next. */
:root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #7a7a76;
  --line: #e6e6e3;
  --frame: #1b1c1e;      /* empty video frame */
  --frame-fg: #f2f1ee;
  --sans: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1680px; margin: 0 auto; }
@media (min-width: 900px) { .wrap { padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); } }

.note { font-family: var(--mono); font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--line); }
.note .wrap { padding-block: 8px; }

header .wrap { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-block: 28px; flex-wrap: wrap; }
.logo { font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
nav { display: flex; gap: 28px; font-size: 13px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; }
nav a { padding-bottom: 2px; border-bottom: 1px solid transparent; }
nav a:hover, nav a[aria-current="page"] { border-color: var(--fg); }

.frame { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--frame); color: var(--frame-fg); overflow: hidden; display: block; }
.frame .shade { position: absolute; inset: 0; }
.frame .play { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 72px; height: 72px; border-radius: 50%; border: 1.5px solid var(--frame-fg); display: grid; place-items: center; }
.frame .play svg { width: 22px; height: 22px; margin-left: 4px; fill: var(--frame-fg); }
.frame .cap { position: absolute; left: 18px; bottom: 16px; right: 18px; display: flex; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }

.reel { padding-block: 0 48px; }
.reel .frame .title { position: absolute; left: 24px; top: 20px; font-weight: 700; font-size: clamp(20px, 3vw, 34px); letter-spacing: .02em; text-transform: uppercase; }
.reel-line { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 14px; font-size: 13px; color: var(--muted); }
.reel-line strong { color: var(--fg); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }

.section-label { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; padding-block: 0 16px; display: flex; justify-content: space-between; gap: 12px; }
.section-label span { color: var(--muted); font-weight: 400; letter-spacing: .04em; text-transform: none; font-family: var(--mono); font-size: 11px; }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding-bottom: 72px; }
.tile { position: relative; display: block; min-width: 0; }
.tile .frame { transition: opacity .3s; }
.tile .name { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; font-weight: 600; font-size: clamp(14px, 1.4vw, 19px); letter-spacing: .14em; text-transform: uppercase; color: var(--frame-fg); text-wrap: balance; transition: opacity .3s; }
.tile .count { position: absolute; right: 10px; top: 10px; font-family: var(--mono); font-size: 10px; color: var(--frame-fg); opacity: .7; }
.tile:hover .frame, .tile:focus-visible .frame { opacity: .82; }
.frame .thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s, transform .6s ease; }
.frame .thumb.ok { opacity: 1; }
.tile:hover .thumb.ok { transform: scale(1.04); }
.tile.has-thumb .name { opacity: 0; background: rgba(10,10,12,.55); }
.tile.has-thumb:hover .name, .tile.has-thumb:focus-visible .name { opacity: 1; }
.tile.has-thumb .frame { opacity: 1; }
@media (hover: none) { .tile.has-thumb .name { opacity: 1; background: linear-gradient(transparent 45%, rgba(0,0,0,.75)); place-items: end start; text-align: left; font-size: 13px; } }
.project .frame .thumb.ok ~ .play { background: rgba(0,0,0,.35); }

/* project page */
.project { padding-bottom: 72px; }
.project h4 { font-size: 22px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; margin: 0 0 20px; }
.project .frame { max-width: 1200px; }
.project .credit { margin: -12px 0 20px; font-size: 13px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.notes { max-width: 1200px; margin-top: 32px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px 48px; align-items: start; }
.notes .blurb { grid-column: 1; margin: 0; font-size: 19px; line-height: 1.5; max-width: 52ch; text-wrap: pretty; }
.notes .accolades { grid-column: 1; list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.notes .accolades li { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--fg); padding: 6px 10px; }
.notes .press { grid-column: 2; grid-row: 1 / span 2; }
.notes .press .label { display: block; font-size: 11px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid var(--fg); }
.notes .press ul { list-style: none; margin: 0; padding: 0; }
.notes .press li a { display: flex; flex-direction: column; gap: 2px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.notes .press li a:hover span { text-decoration: underline; }
.notes .press b { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.notes .press span { font-size: 15px; }
.strapped { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 24px; align-items: center; margin-top: 40px; padding: 20px; border: 1px solid var(--fg); }
.strapped .pic { aspect-ratio: 1; background: #f3f3f1; overflow: hidden; display: grid; place-items: center; }
.strapped img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
.strapped:hover img { transform: scale(1.04); }
.strapped .txt { display: flex; flex-direction: column; gap: 6px; }
.strapped small { font-size: 11px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }
.strapped b { font-family: var(--vcr); font-weight: 400; font-size: 24px; text-transform: uppercase; }
.strapped .txt > span { font-size: 14px; color: #3a3a38; max-width: 46ch; }
.strapped em { font-style: normal; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; margin-top: 6px; }
.strapped:hover em { text-decoration: underline; }
@media (max-width: 560px) { .strapped { grid-template-columns: minmax(0, 1fr); } }
/* Press wall: outlet wordmarks + pull quotes scattered across the page in mixed sizes and faces */
.wall { max-width: 1200px; margin-top: 56px; }
.wall > .label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; padding-bottom: 10px; border-bottom: 1px solid var(--fg); }
.wall .lead { display: block; padding: 48px 0 40px; border-bottom: 1px solid var(--line); }
.wall .lead q { display: block; font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: clamp(30px, 4.6vw, 60px); line-height: 1.08; letter-spacing: -.01em; max-width: 22ch; text-wrap: balance; }
.wall .lead .by { margin-top: 22px; }
.wall .cols { columns: 3 280px; column-gap: 48px; padding-top: 36px; }
.clip { display: block; break-inside: avoid; margin: 0 0 44px; }
.clip q { display: block; margin: 12px 0 10px; quotes: "\201C" "\201D"; text-wrap: pretty; }
.clip .hl { display: block; font-size: 12px; color: var(--muted); line-height: 1.4; }
.clip:hover .hl { color: var(--fg); text-decoration: underline; }
.clip.f0 q { font-family: "Instrument Serif", Georgia, serif; font-size: 30px; line-height: 1.12; }
.clip.f1 q { font-family: var(--sans); font-weight: 600; font-size: 19px; line-height: 1.35; letter-spacing: -.01em; }
.clip.f2 q { font-family: var(--mono); font-size: 14px; line-height: 1.55; }
.clip.f3 q { font-family: "Playfair Display", Georgia, serif; font-style: italic; font-weight: 700; font-size: 24px; line-height: 1.2; }
.clip.f4 q { font-family: "Bebas Neue", Impact, sans-serif; font-size: 36px; line-height: 1; letter-spacing: .01em; }
.clip.f5 q { font-family: var(--vcr); font-size: 17px; line-height: 1.4; text-transform: uppercase; }
.clip.r { text-align: right; } .clip.i { padding-left: 14%; }
.lg { display: inline-flex; align-items: center; color: var(--fg); line-height: 1; white-space: nowrap; }
.lg svg { height: .95em; width: auto; fill: currentColor; }
.lg-rs { font-family: "Playfair Display", Georgia, serif; font-style: italic; font-weight: 900; font-size: 26px; letter-spacing: -.02em; }
.lg-bb { font-size: 26px; }
.lg-nme { font-family: Anton, Impact, sans-serif; font-size: 22px; background: #e2001a; color: #fff; padding: 4px 8px 3px; letter-spacing: .02em; }
.lg-cx { font-family: "Archivo Black", sans-serif; font-size: 22px; letter-spacing: -.03em; text-transform: uppercase; }
.lg-kr { font-family: Anton, Impact, sans-serif; font-size: 26px; text-transform: uppercase; transform: skew(-8deg); letter-spacing: .01em; }
.lg-ux { font-family: "Archivo Black", sans-serif; font-style: italic; font-size: 20px; text-transform: uppercase; }
.lg-bebas { font-family: "Bebas Neue", Impact, sans-serif; font-size: 28px; letter-spacing: .12em; }
.lg-anton { font-family: Anton, Impact, sans-serif; font-size: 26px; text-transform: uppercase; letter-spacing: .02em; }
.lg-serif { font-family: "Instrument Serif", Georgia, serif; font-size: 28px; }
.lg-black { font-family: "Archivo Black", sans-serif; font-size: 20px; text-transform: uppercase; letter-spacing: .02em; }
.lg-wide { font-family: var(--sans); font-weight: 700; font-size: 14px; letter-spacing: .28em; text-transform: uppercase; }
.lead .lg { font-size: 34px; }
@media (max-width: 760px) { .wall .cols { columns: 1; } .clip.i { padding-left: 0; } .clip.r { text-align: left; } }
@media (max-width: 760px) { .notes { grid-template-columns: minmax(0, 1fr); } .notes .press { grid-column: 1; grid-row: auto; } }
.project .watch { display: inline-flex; gap: 8px; margin-top: 16px; font-size: 13px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; border-bottom: 1px solid var(--fg); padding-bottom: 2px; }
.parts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.parts a { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); padding: 6px 10px; }
.parts a:hover { border-color: var(--fg); }
.pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); max-width: 1200px; }
.pager a { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pager a:last-child { text-align: right; }
.pager small { font-size: 11px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.pager b { font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }

/* contact */
.contact { padding-block: 24px 96px; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
.contact > * { min-width: 0; }
.contact h4 { font-size: 22px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; margin: 0 0 16px; }
.contact p { max-width: 52ch; color: #3b3b39; margin: 0 0 12px; }
.contact dl { display: grid; grid-template-columns: auto 1fr; gap: 12px 28px; margin: 0; }
.contact dt { font-size: 11px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; padding-top: 3px; }
.contact dd { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
.contact dd a { border-bottom: 1px solid var(--line); }
.contact dd a:hover { border-color: var(--fg); }

footer .wrap { padding-block: 28px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

@font-face { font-family: "VCR OSD Mono"; src: url("fonts/vcr-osd-mono.ttf") format("truetype"); font-display: swap; }
:root { --vcr: "VCR OSD Mono", var(--mono); }
/* reel as the page background on the homepage */
.top { position: relative; }
.is-home header { position: absolute; inset: 0 0 auto; z-index: 3; color: #fff; }
.is-home nav a:hover, .is-home nav a[aria-current="page"] { border-color: #fff; }
#hero { display: none; }
.is-home #hero { display: block; }
.bg-reel { position: relative; height: max(520px, 92svh); overflow: hidden; background: #0b0c0d; color: #fff; margin-bottom: 40px; }
.bg-reel .footage { position: absolute; inset: -10%; background:
  radial-gradient(40% 50% at 30% 40%, rgba(214,150,96,.55), transparent 70%),
  radial-gradient(45% 55% at 75% 60%, rgba(60,105,150,.6), transparent 70%),
  radial-gradient(30% 40% at 60% 20%, rgba(170,60,90,.4), transparent 70%), #121316;
  animation: drift 18s ease-in-out infinite alternate; }
.bg-reel .footage.b { mix-blend-mode: screen; opacity: .6; animation-duration: 11s; animation-direction: alternate-reverse;
  background: radial-gradient(35% 45% at 50% 70%, rgba(240,200,140,.45), transparent 70%), radial-gradient(30% 35% at 20% 80%, rgba(90,150,170,.4), transparent 70%); }
@keyframes drift { 0% { transform: translate(0,0) scale(1); } 33% { transform: translate(-4%,3%) scale(1.08); } 66% { transform: translate(3%,-2%) scale(1.03); } 100% { transform: translate(-2%,-4%) scale(1.1); } }
.bg-reel .bgframe { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: #000 url(https://i.ytimg.com/vi/a6YsQwg-jrs/hqdefault.jpg) center/cover; }
.bg-reel .bgframe iframe { position: absolute; left: 50%; top: 50%; width: max(100%, 177.78vh); height: max(100%, 56.25vw); transform: translate(-50%, -50%); border: 0; }
.bg-reel .bgvid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
.bg-reel::before { content: ""; position: absolute; inset: 0; z-index: 1; background: repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px); }
.bg-reel::after { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(0,0,0,.45), transparent 22%, transparent 55%, rgba(0,0,0,.6)); }
.bg-reel .over { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; padding-block: 0 36px; }
.bg-reel h1 { margin: 0; font-family: var(--vcr); font-weight: 400; font-size: clamp(40px, 7.5vw, 112px); line-height: 1; letter-spacing: 0.02em; text-transform: uppercase; text-shadow: 0 0 18px rgba(255,255,255,.18); }
.bg-reel .roles { margin-top: 12px; font-size: 13px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; opacity: .9; }
.bg-reel .full { display: inline-flex; align-items: center; gap: 10px; border: 1px solid rgba(255,255,255,.7); padding: 12px 18px; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.bg-reel .full:hover { background: #fff; color: #111; }
.bg-reel .full svg { width: 12px; height: 12px; fill: currentColor; }
.bg-reel .live { position: absolute; z-index: 2; right: max(16px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%) rotate(90deg); transform-origin: right center; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .55; }
/* Title screen: everything set in VCR OSD Mono to match the name */
.is-home header .logo, .is-home header nav a, .bg-reel .roles, .bg-reel .full, .bg-reel .live, .vf-hud { font-family: var(--vcr); font-weight: 400; }
.is-home header .logo { font-size: 22px; letter-spacing: .02em; text-transform: uppercase; }
.is-home header nav a { font-size: 14px; letter-spacing: .08em; }
.bg-reel .roles { font-size: 15px; letter-spacing: .08em; }
.bg-reel .full { font-size: 14px; letter-spacing: .06em; }
.vf-hud { font-size: 13px; letter-spacing: .04em; }
@media (prefers-reduced-motion: reduce) { .bg-reel .footage { animation: none; } }

/* about */
.about { padding-block: 24px 96px; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 56px; align-items: start; }
.about .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; display: block; }
.about .portrait { margin: 0; overflow: hidden; aspect-ratio: 4 / 5; max-width: 100%; background: linear-gradient(160deg, #2a2c30, #121315); color: #9a9a96; display: grid; place-items: center; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; position: sticky; top: 24px; }
.about h4 { font-size: 22px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; margin: 0 0 20px; }
.about .bio p { max-width: 64ch; margin: 0 0 18px; font-size: 17px; line-height: 1.65; color: #2a2a28; }
.about .bio p:first-of-type { font-size: 21px; line-height: 1.5; color: var(--fg); }
.figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 36px 0; padding-block: 24px; border-block: 1px solid var(--line); }
.figures div { min-width: 0; }
.figures strong { display: block; font-size: clamp(30px, 4vw, 48px); font-weight: 700; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.figures span { display: block; margin-top: 8px; font-size: 11px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 14px 28px; margin: 0; }
.facts dt { font-size: 11px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; padding-top: 4px; }
.facts dd { margin: 0; font-size: 16px; }
@media (max-width: 800px) { .about { grid-template-columns: 1fr; gap: 32px; } .about .portrait { position: static; max-width: 420px; } }
@media (max-width: 480px) { .figures { grid-template-columns: 1fr; } }

.about.solo { grid-template-columns: minmax(0, 1fr); max-width: 980px; }

/* gear */
.gear { padding-block: 24px 96px; }
.gear-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 40px; }
.gear-head h4 { font-size: 22px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; margin: 0 0 10px; }
.gear-head p { margin: 0; max-width: 56ch; color: #3b3b39; }
.gear-cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px 32px; }
.gear-cat { min-width: 0; }
.gear-cat h5 { margin: 0; padding-bottom: 10px; border-bottom: 1px solid var(--fg); font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; display: flex; justify-content: space-between; }
.gear-cat h5 span { font-family: var(--mono); font-weight: 400; color: var(--muted); letter-spacing: 0; }
.gear-cat ul { list-style: none; margin: 0; padding: 0; }
.gear-cat li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-block: 11px; border-bottom: 1px solid var(--line); font-size: 15px; }
.gear-cat li.ph { color: var(--muted); font-style: italic; }
.gear-cat li em { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
@media (max-width: 1000px) { .gear-cats { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .gear-cats { grid-template-columns: 1fr; } }

/* intro: looking through the viewfinder, focus pulls in, shutter fires, site appears */
#intro { position: fixed; inset: 0; z-index: 50; pointer-events: auto; color: #fff; font-family: var(--mono); overflow: hidden; }
#intro.gone { display: none; }

const LOGOS = [
  [/rolling stone/i, "lg-rs"], [/billboard/i, "lg-bb", BILLBOARD], [/^nme/i, "lg-nme", "NME"], [/complex/i, "lg-cx"],
  [/kerrang/i, "lg-kr"], [/uproxx/i, "lg-ux"], [/revolt|alternative press|loudwire|consequence|xxl|tmz|people|hypebeast|stereogum/i, null],
];
const FACES = ["lg-bebas", "lg-anton", "lg-serif", "lg-black", "lg-wide"];
function logo(name) {
  const hit = LOGOS.find(([re]) => re.test(name));
  if (hit && hit[1]) return `<span class="lg ${hit[1]}" aria-label="${esc(name)}">${hit[2] || esc(name)}</span>`;
  const n = [...name].reduce((h, c) => h + c.charCodeAt(0), 0);
  return `<span class="lg ${FACES[n % FACES.length]}">${esc(name)}</span>`;
}
function notes(x) {
  const press = x.press || [], quoted = press.filter(q => q.quote);
  const lead = quoted[0], rest = press.filter(q => q !== lead);
  const clip = (q, k) => `<a class="clip f${(k * 5 + 1) % 6}${k % 3 == 1 ? " i" : k % 4 == 3 ? " r" : ""}" href="${q.url}" target="_blank" rel="noopener">
        ${logo(q.outlet)}${q.quote ? `<q>${esc(q.quote)}</q>` : ""}<span class="hl">${esc(q.headline)} ↗</span></a>`;
  return `<section class="notes">
    ${x.blurb ? `<p class="blurb">${esc(x.blurb)}</p>` : ""}
    ${x.accolades && x.accolades.length ? `<ul class="accolades">${x.accolades.map(a => `<li>${a.url ? `<a href="${a.url}" target="_blank" rel="noopener">${esc(a.text)}</a>` : esc(a.text)}</li>`).join("")}</ul>` : ""}
  </section>
  ${press.length ? `<section class="wall">
    <div class="label"><span>Press</span><span>${press.length} ${press.length > 1 ? "write-ups" : "write-up"}</span></div>
    ${lead ? `<a class="lead clip" href="${lead.url}" target="_blank" rel="noopener">${logo(lead.outlet)}<q>${esc(lead.quote)}</q><span class="hl by">${esc(lead.headline)} ↗</span></a>` : ""}
    ${rest.length ? `<div class="cols">${rest.map(clip).join("")}</div>` : ""}
  </section>` : ""}`;
}

function project(i) {
  const w = W[i], p = W[(i - 1 + W.length) % W.length], n = W[(i + 1) % W.length];
  const vids = Array.isArray(w.v) ? w.v : [w.v];
  const info = PRESS[w.slug];
  return `
  <article class="project">
    <h4>${esc(w.t)}</h4>
    ${info && info.artist ? `<p class="credit">${esc(info.artist)}${info.credit ? ` <span>· ${esc(info.credit)}</span>` : ""}</p>` : ""}
    <a class="frame" href="${url(vids[0])}" target="_blank" rel="noopener" aria-label="Play ${esc(w.t)}" ${ytId(vids[0]) ? `data-yt="${ytId(vids[0])}"` : ""}>
      <span class="shade" style="background:${shade(i)}"></span>${thumb(vids[0])}${play}
    </a>
    ${vids.length > 1
      ? `<div class="parts">${vids.map((v, k) => `<a href="${url(v)}" data-part="${ytId(v)}">${info && info.parts ? esc(info.parts[k]) : `Part ${k + 1}`}</a>`).join("")}</div>`
      : `<a class="watch" href="${url(vids[0])}" target="_blank" rel="noopener">Watch on ${where(vids[0])} ↗</a>`}
    ${info ? notes(info) : ""}
    <nav class="pager" aria-label="More projects">
      <a href="#${p.slug}"><small>Previous</small><b>${esc(p.t)}</b></a>
      <a href="#${n.slug}"><small>Next</small><b>${esc(n.t)}</b></a>
    </nav>
  </article>`;
}

const view = document.getElementById("view");
function route() {
  const h = location.hash.slice(1);
  const i = W.findIndex(w => w.slug === h);
  const page = ["contact", "gear", "about"].includes(h) ? h : null;
  view.innerHTML = page === "contact" ? contact() : page === "gear" ? gear() : page === "about" ? about() : i >= 0 ? project(i) : home();
  document.getElementById("nav-about").toggleAttribute("aria-current", h === "about");
  document.body.classList.toggle("is-home", !page && i < 0);
  document.getElementById("nav-work").toggleAttribute("aria-current", !page);
  document.getElementById("nav-gear").toggleAttribute("aria-current", h === "gear");
  document.getElementById("nav-contact").toggleAttribute("aria-current", h === "contact");
  if (h && h !== "work") window.scrollTo(0, 0);
}
const embed = id => `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1" title="Video player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe>`;
view.addEventListener("click", e => {
  const f = e.target.closest(".frame[data-yt]"), part = e.target.closest("[data-part]");
  if (f) { e.preventDefault(); f.innerHTML = embed(f.dataset.yt); f.removeAttribute("data-yt"); }
  if (part) { e.preventDefault(); const fr = view.querySelector(".project .frame"); fr.innerHTML = embed(part.dataset.part); fr.removeAttribute("data-yt"); fr.scrollIntoView({ behavior: "smooth", block: "center" }); }
});
(function bgReel() {
  const vid = document.querySelector(".bg-reel .bgvid");
  const src = BG_VIMEO ? `https://player.vimeo.com/video/${BG_VIMEO}?background=1&autoplay=1&loop=1&muted=1`
    : BG_YOUTUBE ? `https://www.youtube-nocookie.com/embed/${BG_YOUTUBE}?autoplay=1&mute=1&loop=1&playlist=${BG_YOUTUBE}&controls=0&playsinline=1&modestbranding=1&rel=0&disablekb=1`
    : null;
  if (!vid || !src) return;
  const box = document.createElement("div");
  box.className = "bgframe";
  box.innerHTML = `<iframe src="${src}" title="" tabindex="-1" aria-hidden="true" allow="autoplay; encrypted-media" frameborder="0"></iframe>`;
  vid.replaceWith(box);
})();
window.addEventListener("hashchange", route);
route();

// Intro: viewfinder focuses, shutter fires at ~2.2s, then the site is revealed
const intro = document.getElementById("intro");
let timers = [], raf;
function finish() {
  timers.forEach(clearTimeout); cancelAnimationFrame(raf);
  intro.classList.add("gone"); intro.classList.remove("click", "out");
}
function playIntro() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return finish();
  timers.forEach(clearTimeout); document.body.classList.remove("snapped");
  intro.className = ""; void intro.offsetWidth;
  intro.querySelectorAll(".vf-blur, .vf-reticle").forEach(el => { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; });
  const t0 = performance.now(), tc = document.getElementById("vf-tc");
  const tick = () => { const f = Math.floor((performance.now() - t0) / 1000 * 23.976);
    tc.textContent = `00:00:${String(Math.floor(f / 24)).padStart(2, "0")}:${String(f % 24).padStart(2, "0")}`; raf = requestAnimationFrame(tick); };
  tick();
  timers = [
    setTimeout(() => { cancelAnimationFrame(raf); intro.classList.add("click"); document.body.classList.add("snapped"); }, 2200),
    setTimeout(() => intro.classList.add("out"), 2650),
    setTimeout(finish, 3050)
  ];
}
document.getElementById("vf-skip").addEventListener("click", finish);
let seen = false;
try { seen = sessionStorage.getItem("introSeen") === "1"; sessionStorage.setItem("introSeen", "1"); } catch (e) {}
seen ? finish() : playIntro();
</script>
